[project]
name = "coverletterer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.109.1",
    "beautifulsoup4>=4.13.0",
    "boto3>=1.43.36",
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "playwright>=1.48.0",
    "psycopg[binary]>=3.3.4",
    "pypdf>=5.1.0",
    "python-dotenv>=1.1.0",
    "reportlab>=4.2.5",
    "reflex>=0.9.4",
    "reflex-local-auth>=0.5.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "pytest>=9.0.3",
]
