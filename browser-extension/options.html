<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>CoverLetterer Capture — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #111;
      }
      h1 {
        font-size: 1.1rem;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 0.85rem;
        margin: 1rem 0 0.25rem;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 0.9rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.85rem;
      }
      .ok {
        color: #16a34a;
      }
      .err {
        color: #dc2626;
      }
      p.hint {
        color: #666;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>CoverLetterer Capture</h1>
    <p class="hint">
      Generate a token on your CoverLetterer Profile page ("Extension
      access"), then paste it below.
    </p>

    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" placeholder="http://localhost:8000" />

    <label for="token">Personal access token</label>
    <input id="token" type="password" placeholder="paste your token here" />

    <button id="save">Save &amp; Test</button>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
